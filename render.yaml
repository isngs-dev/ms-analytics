# Render Blueprint: New > Blueprint > pick this repository. See docs/DEPLOY_RENDER.md for the full walkthrough.
#   ms-db   managed PostgreSQL
#   ms-api  FastAPI + the Drive sync scheduler (private service: only ms-web can reach it, one instance on purpose)
#   ms-web  Next.js; the only public address. It proxies /api/* to ms-api, so the login cookie stays same-origin.
databases:
  - name: ms-db
    databaseName: ms_analytics
    user: ms
    postgresMajorVersion: "16"
    plan: basic-1gb  # data is ~0.7 GB; pick a plan with enough disk in the dashboard if it asks

services:
  - type: pserv
    name: ms-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard  # 2 GB RAM: reading large .xlsx workbooks needs memory; do not scale to more than 1 instance
    numInstances: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_SOURCE
        value: drive
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SYNC_INTERVAL_MINUTES
        value: "10"
      - key: GOOGLE_OAUTH_TOKEN_FILE
        value: /etc/secrets/oauth-token.json  # add this file under Environment > Secret Files
      - key: DRIVE_ROOT_FOLDER_ID
        sync: false  # asked for when the Blueprint is created

  - type: web
    name: ms-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    healthCheckPath: /login
    envVars:
      - key: API_INTERNAL_URL  # host:port of ms-api; Next bakes the /api proxy target in at build time
        fromService:
          type: pserv
          name: ms-api
          property: hostport
