# Loaded automatically by `docker compose up` for local development only.
services:
  db:
    ports:
      - "5434:5432"
  api:
    user: "0:0"
    volumes:
      - ./backend:/app
      - ./secrets:/secrets:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
  web:
    profiles: ["full"] # in development run the frontend with `npm run dev` instead
