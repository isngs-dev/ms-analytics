# Production-style stack:  docker compose -f docker-compose.yml up -d --build
# Local development additionally loads docker-compose.override.yml automatically (hot reload, db port).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ms_analytics}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ms} -d ${POSTGRES_DB:-ms_analytics}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ms}:${POSTGRES_PASSWORD:-ms_dev_password}@db:5432/${POSTGRES_DB:-ms_analytics}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8020:8000" # handy for health checks; the browser goes through the web service
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
